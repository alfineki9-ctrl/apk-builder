name: Universal APK Builder (Flutter & Native Android)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL Link Direct ZIP Project (Google Drive direct, MediaFire direct, Discord, GitHub Release, dll)'
        required: true
      tag:
        description: 'Nama Versi / Tag Release (contoh: v1.0.0 atau base2-v1)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Validasi Input
        run: |
          if [ -z "${{ github.event.inputs.zip_url }}" ]; then
            echo "::error::Input zip_url kosong."
            exit 1
          fi
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "::error::Input tag kosong."
            exit 1
          fi

      - name: Download & Extract Project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading ZIP from: ${{ github.event.inputs.zip_url }}"
          if [[ "${{ github.event.inputs.zip_url }}" == *"releases/download"* ]]; then
            TAG_NAME=$(echo "${{ github.event.inputs.zip_url }}" | awk -F'/releases/download/' '{print $2}' | awk -F'/' '{print $1}')
            echo "Downloading asset from release tag: $TAG_NAME"
            mkdir -p downloaded_source
            gh release download "$TAG_NAME" --pattern "*.zip" --dir downloaded_source --repo "${{ github.repository }}" || true
            if ls downloaded_source/*.zip 1> /dev/null 2>&1; then
              mv downloaded_source/*.zip project.zip
            else
              echo "Fallback ke direct curl..."
              curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -L -o project.zip "${{ github.event.inputs.zip_url }}"
            fi
          else
            curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          fi
          
          mkdir -p project_source
          unzip -q project.zip -d project_source
          
          # Jika ZIP dibungkus satu folder utama, ekstrak isinya ke root folder
          ITEMS_COUNT=$(ls -1 project_source | wc -l)
          FIRST_ITEM=$(ls -1 project_source | head -n 1)
          if [ "$ITEMS_COUNT" -eq 1 ] && [ -d "project_source/$FIRST_ITEM" ]; then
            echo "Unwrapping nested folder: $FIRST_ITEM"
            mv project_source/"$FIRST_ITEM"/* project_source/ 2>/dev/null || true
            mv project_source/"$FIRST_ITEM"/.[!.]* project_source/ 2>/dev/null || true
          fi

      - name: Deteksi Tipe Project (Flutter vs Native Android)
        id: detect
        run: |
          cd project_source
          if [ -f "pubspec.yaml" ]; then
            echo "TYPE=flutter" >> $GITHUB_OUTPUT
            echo "✅ Tipe Project Terdeteksi: FLUTTER (Base 1 / Nervous App)"
          elif [ -f "android/build.gradle" ] || [ -f "build.gradle" ]; then
            echo "TYPE=native_android" >> $GITHUB_OUTPUT
            echo "✅ Tipe Project Terdeteksi: NATIVE ANDROID (Base 2 / Sync XxX)"
          else
            echo "::error::Project tidak dikenali! Tidak ada 'pubspec.yaml' dan tidak ada 'android/build.gradle'."
            exit 1
          fi

      # ----------------------------------------------------
      # SETUP TOOLS
      # ----------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter (Khusus Project Flutter)
        if: steps.detect.outputs.TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python & Pillow (Khusus Base 2 Native Android)
        if: steps.detect.outputs.TYPE == 'native_android'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----------------------------------------------------
      # PROSES BUILD FLUTTER (BASE 1)
      # ----------------------------------------------------
      - name: Build Flutter APK
        if: steps.detect.outputs.TYPE == 'flutter'
        run: |
          cd project_source
          chmod +x android/gradlew 2>/dev/null || true
          
          # 1. Optimasi konfigurasi Gradle & AGP
          mkdir -p android
          touch android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

          # 2. Upgrade Gradle wrapper jika versi 8.12 menjadi 8.14 (Flutter requirement)
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-8.12-all.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-8.12-bin.zip/gradle-8.14-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-8.10-all.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # 3. Hapus ndkVersion spesifik agar runner menggunakan default NDK
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/ndkVersion/d' android/app/build.gradle.kts 2>/dev/null || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/ndkVersion/d' android/app/build.gradle 2>/dev/null || true
          fi

          # 4. Patch & Sanitasi Dependensi Flutter (Fix font_awesome_flutter 11 mismatch, minSdkVersion, dsb)
          if [ -f "pubspec.yaml" ]; then
            # Kembalikan font_awesome_flutter ke versi 10.7.0 yang stabil dan menggunakan IconData (bukan FaIconData)
            sed -i -E 's/font_awesome_flutter:[[:space:]]*[\^~>=]*11[0-9.]*/font_awesome_flutter: ^10.7.0/g' pubspec.yaml
            if grep -q "font_awesome_flutter: 11" pubspec.lock 2>/dev/null; then
              echo "Mereset pubspec.lock agar resolve font_awesome_flutter 10.7.0..."
              rm -f pubspec.lock
            fi
          fi

          # 5. Patch Flutter SDK IconData (Fix breaking change in Flutter 3.27+ for font_awesome_flutter & older packages)
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "Patching Flutter SDK in $FLUTTER_ROOT..."
          find "$FLUTTER_ROOT" -name "icon_data.dart" -exec sed -i -E 's/(final|base|interface)[[:space:]]+class[[:space:]]+IconData/class IconData/g' {} + 2>/dev/null || true

          # 6. Ambil dependencies
          flutter pub get

          # Patch pub-cache as well if any package extends IconData
          if [ -d "$HOME/.pub-cache" ]; then
            echo "Patching pub-cache in $HOME/.pub-cache..."
            find "$HOME/.pub-cache" -name "icon_data.dart" -exec sed -i -E 's/(final|base|interface)[[:space:]]+class[[:space:]]+IconData/class IconData/g' {} + 2>/dev/null || true
          fi

          # 7. Pastikan minSdkVersion minimal 21 (mencegah kegagalan library modern)
          find android -name "build.gradle" -exec sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 21/g' {} + 2>/dev/null || true
          find android -name "build.gradle.kts" -exec sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 21/g' {} + 2>/dev/null || true

          # 8. Build Release APK
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      # ----------------------------------------------------
      # PROSES BUILD NATIVE ANDROID (BASE 2)
      # ----------------------------------------------------
      - name: Build Native Android APK (Base 2)
        if: steps.detect.outputs.TYPE == 'native_android'
        run: |
          cd project_source
          if [ -f "generate_icons.py" ]; then
            echo "Generating icons..."
            pip install Pillow
            python3 generate_icons.py || true
          fi
          
          if [ -d "android" ]; then
            cd android
          fi
          
          # Pastikan gradle wrapper jar tersedia
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ----------------------------------------------------
      # KUMPULKAN FILE APK HASIL COMPILE
      # ----------------------------------------------------
      - name: Kumpulkan Hasil APK
        run: |
          mkdir -p output_apk
          # Cari file release apk
          FOUND_APK=$(find project_source -type f -name "*release*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find project_source -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          fi
          
          if [ -z "$FOUND_APK" ]; then
            echo "::error::Tidak ditemukan file APK hasil build!"
            exit 1
          fi
          
          echo "APK Ditemukan: $FOUND_APK"
          cp "$FOUND_APK" output_apk/app-release.apk

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.inputs.tag }}
          path: output_apk/app-release.apk
          retention-days: 30

      - name: Buat GitHub Release Otomatis
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          files: output_apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
