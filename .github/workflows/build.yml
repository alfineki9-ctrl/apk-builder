name: Universal APK Builder (Flutter & Native Android)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL Link Direct ZIP Project'
        required: true
      tag:
        description: 'Versi Tag Release'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Validasi Input
        run: |
          if [ -z "${{ github.event.inputs.zip_url }}" ]; then
            echo "::error::Input zip_url kosong."
            exit 1
          fi

      - name: Download & Extract Project ZIP
        run: |
          echo "Downloading ZIP from: ${{ github.event.inputs.zip_url }}"
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p project_source
          unzip -q project.zip -d project_source
          
          ITEMS_COUNT=$(ls -1 project_source | wc -l)
          FIRST_ITEM=$(ls -1 project_source | head -n 1)
          if [ "$ITEMS_COUNT" -eq 1 ] && [ -d "project_source/$FIRST_ITEM" ]; then
            echo "Unwrapping nested folder: $FIRST_ITEM"
            mv project_source/"$FIRST_ITEM"/* project_source/ 2>/dev/null || true
            mv project_source/"$FIRST_ITEM"/.[!.]* project_source/ 2>/dev/null || true
          fi

      - name: Deteksi Tipe Project (Flutter vs Native Android)
        id: detect
        run: |
          cd project_source
          if [ -f "pubspec.yaml" ]; then
            echo "TYPE=flutter" >> $GITHUB_OUTPUT
            echo "✅ Tipe Project Terdeteksi: FLUTTER"
          elif [ -f "android/build.gradle" ] || [ -f "build.gradle" ]; then
            echo "TYPE=native_android" >> $GITHUB_OUTPUT
            echo "✅ Tipe Project Terdeteksi: NATIVE ANDROID"
          else
            echo "::error::Project tidak dikenali!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        if: steps.detect.outputs.TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python & Pillow
        if: steps.detect.outputs.TYPE == 'native_android'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Flutter APK
        if: steps.detect.outputs.TYPE == 'flutter'
        run: |
          cd project_source
          chmod +x android/gradlew 2>/dev/null || true
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Build Native Android APK
        if: steps.detect.outputs.TYPE == 'native_android'
        run: |
          cd project_source
          if [ -f "generate_icons.py" ]; then
            pip install Pillow
            python3 generate_icons.py || true
          fi
          if [ -d "android" ]; then
            cd android
          fi
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Kumpulkan Hasil APK
        run: |
          mkdir -p output_apk
          FOUND_APK=$(find project_source -type f -name "*release*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find project_source -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          fi
          if [ -z "$FOUND_APK" ]; then
            echo "::error::Tidak ditemukan file APK hasil build!"
            exit 1
          fi
          cp "$FOUND_APK" output_apk/app-release.apk

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.inputs.tag }}
          path: output_apk/app-release.apk
          retention-days: 30

      - name: Buat GitHub Release Otomatis
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          files: output_apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
